<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ばなな先生 - Banana Sensei</title>
<style>
  :root {
    --banana: #ffd93d;
    --banana-deep: #f5b800;
    --banana-dark: #c98a00;
    --leaf: #4caf50;
    --bg: #fffbe6;
    --ink: #3a2f0b;
    --card: #ffffff;
    --shadow: rgba(201, 138, 0, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: linear-gradient(160deg, #fffbe6 0%, #fff3b0 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 2rem; letter-spacing: 0.05em; }
  h1 .emoji { font-size: 2.2rem; }
  .tagline { color: #8a7a3a; margin-top: 6px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 8px 30px var(--shadow);
    padding: 24px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 20px;
  }
  .dropzone {
    border: 3px dashed var(--banana-deep);
    border-radius: 16px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    background: #fffdf2;
  }
  .dropzone:hover, .dropzone.dragover {
    background: #fff7d6;
    transform: scale(1.01);
  }
  .dropzone .big { font-size: 3rem; display: block; margin-bottom: 8px; }
  .dropzone p { color: #8a7a3a; font-size: 0.95rem; }
  #fileInput { display: none; }
  #preview {
    display: none;
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 12px;
    margin-top: 16px;
    background: #f7f3e0;
  }
  .btn {
    display: inline-block;
    background: var(--banana);
    color: var(--ink);
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--banana-dark);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover { transform: translateY(1px); box-shadow: 0 3px 0 var(--banana-dark); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--banana-dark); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  #status {
    text-align: center;
    margin-top: 16px;
    color: #8a7a3a;
    font-size: 0.95rem;
    min-height: 1.4em;
  }
  #result { display: none; }
  #result.show { display: block; }
  .result-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .result-emoji { font-size: 3.4rem; }
  .result-title { font-size: 1.4rem; font-weight: 800; }
  .result-sub { color: #8a7a3a; font-size: 0.9rem; }
  .meter {
    height: 14px;
    border-radius: 999px;
    background: #f0e6c0;
    overflow: hidden;
    margin: 14px 0 6px;
  }
  .meter > div {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--leaf), var(--banana), var(--banana-dark));
    transition: width 0.6s ease;
  }
  .scores { font-size: 0.85rem; color: #8a7a3a; display: flex; justify-content: space-between; }
  .advice {
    margin-top: 16px;
    background: #fffbe6;
    border-left: 6px solid var(--banana-deep);
    border-radius: 8px;
    padding: 14px 16px;
    line-height: 1.7;
  }
  .advice h3 { font-size: 1rem; margin-bottom: 4px; }
  footer { color: #b0a060; font-size: 0.8rem; text-align: center; line-height: 1.6; }
  .privacy { font-size: 0.8rem; color: #b0a060; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><span class="emoji">🍌</span> ばなな先生 <span class="emoji">🎓</span></h1>
  <p class="tagline">バナナの写真をどうぞ。熟れ具合を見きわめて、いちばんおいしい使い方を教えます。</p>
  <p style="color:#b8860b;font-size:0.85rem;margin-top:2px;">Snap a banana — I'll tell you how ripe it is and what to make with it. 🍌</p>
</header>

<div class="card">
  <div class="dropzone" id="dropzone">
    <span class="big">📷🍌</span>
    <p><strong>クリックして写真を選ぶ</strong> か、ここにドラッグ＆ドロップ</p>
    <p style="margin-top:6px;font-size:0.8rem">※ 画像はブラウザの中だけで処理されます。どこにも送信しません。</p>
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <img id="preview" alt="preview">
  <div style="text-align:center; margin-top:16px;">
    <button class="btn" id="analyzeBtn" disabled>🍌 熟れ具合をたずねる</button>
  </div>
  <div id="status"></div>
</div>

<div class="card" id="result">
  <div class="result-head">
    <div class="result-emoji" id="resultEmoji">🍌</div>
    <div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-en" id="resultEn" style="font-size:0.85rem;color:#b8860b;margin-top:2px;"></div>
    </div>
  </div>
  <div class="meter"><div id="meterFill"></div></div>
  <div class="scores"><span id="scoreLabel"></span><span id="scoreValue"></span></div>
  <div class="advice" id="advice"></div>
</div>

<footer>
  🍌 ばなな先生 — Banana Hacks 2026 出品作品<br>
  画像AI（ゼロショット画像分類 / CLIP）をブラウザだけで動かしています
</footer>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

env.allowLocalModels = false;

const CLASSES = {
  green:  { emoji: '🟢', title: 'まだ青いバナナ',   sub: '未熟です',           en: 'Unripe — cook it, don\'t eat it raw',           advice: '加熱すると甘くなるタイプ。<b>バナナチップス</b>や<b>焼きバナナ</b>、カレーに入れても◎。常温で2〜3日置けば黄色くなります。' },
  ripe:   { emoji: '🍌', title: '食べごろバナナ',   sub: 'いちばんおいしい時期', en: 'Perfectly ripe — enjoy now', advice: 'そのまま食べるのが一番！<b>バナナスムージー</b>や<b>ヨーグルト添え</b>も最高です。皮にシュガースポットが出はじめたら次の段階。' },
  over:   { emoji: '🟤', title: '完熟バナナ',       sub: '甘さが最大級',        en: 'Very ripe — best for baking',        advice: '甘みが強いので<b>バナナブレッド</b>や<b>バナナケーキ</b>のチャンス！つぶして冷凍しておけば、いつでもスムージーに使えます。' },
  rotten: { emoji: '⚠️', title: 'そろそろ危ない',   sub: '傷みが進んでいます',  en: 'Past its prime — check before eating',  advice: '黒ずみやカビがある場合は食べずに処分しましょう。まだ中身がきれいなら加熱調理で使い切るのが安全です。' },
  other:  { emoji: '🤔', title: 'これは…バナナ？', sub: 'バナナに見えませんでした', en: 'That does not look like a banana', advice: 'バナナが大きく写っている写真で、もう一度ためしてみてください。皮ごと・房ごとでも大丈夫です。' },
};

// 各クラスに複数の言い方を用意し、いちばん合う言い方のスコアを採用する（ゼロショット分類の定番テクニック）
const PROMPTS = [
  { key: 'green',  en: 'a photo of an unripe green banana' },
  { key: 'green',  en: 'a photo of green bananas on a plant' },
  { key: 'green',  en: 'a photo of hard green bananas' },
  { key: 'ripe',   en: 'a photo of a fresh yellow banana' },
  { key: 'ripe',   en: 'a photo of ripe yellow bananas' },
  { key: 'ripe',   en: 'a photo of a perfect yellow banana' },
  { key: 'over',   en: 'a photo of an old banana with brown spots' },
  { key: 'over',   en: 'a photo of a very ripe brown banana' },
  { key: 'over',   en: 'a photo of overripe bananas with blackened skin' },
  { key: 'rotten', en: 'a photo of a rotten banana covered in mold' },
  { key: 'rotten', en: 'a photo of a spoiled black mushy banana' },
  { key: 'rotten', en: 'a photo of a decayed rotting banana' },
  { key: 'other',  en: 'a photo of something that is not a banana' },
];

let classifier = null;
let currentImageURL = null;

async function loadModel() {
  if (classifier) return classifier;
  setStatus('🧠 AIモデルを準備しています…（初回は少し時間がかかります）');
  classifier = await pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32', {
    dtype: 'q8',
    progress_callback: (p) => {
      if (p.status === 'progress' && p.progress != null) {
        setStatus(`🧠 AIモデルをダウンロード中… ${Math.round(p.progress)}%`);
      }
    },
  });
  setStatus('');
  return classifier;
}

function setStatus(t) {
  // NOTE: innerHTML is only ever called with internal strings (status text + numeric progress). No user input reaches it.
  document.getElementById('status').innerHTML = t;
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  if (currentImageURL) URL.revokeObjectURL(currentImageURL);
  currentImageURL = URL.createObjectURL(file);
  preview.src = currentImageURL;
  preview.style.display = 'block';
  analyzeBtn.disabled = false;
  document.getElementById('result').classList.remove('show');
  setStatus('準備OK！ボタンを押してください。');
}

analyzeBtn.addEventListener('click', async () => {
  if (!currentImageURL) return;
  analyzeBtn.disabled = true;
  try {
    const clf = await loadModel();
    setStatus('🔍 じっと見ています…');
    const output = await clf(currentImageURL, PROMPTS.map(p => p.en));
    // クラスごとに「いちばん合った言い方」のスコアを採用
    const byClass = {};
    for (const o of output) {
      const key = (PROMPTS.find(p => p.en === o.label) || { key: 'other' }).key;
      if (!byClass[key] || o.score > byClass[key]) byClass[key] = o.score;
    }
    let bestKey = 'other', bestScore = 0;
    for (const [k, v] of Object.entries(byClass)) {
      if (v > bestScore) { bestKey = k; bestScore = v; }
    }
    showResult(bestKey, bestScore, output);
  } catch (err) {
    setStatus('⚠️ エラーが発生しました: ' + err.message);
  } finally {
    analyzeBtn.disabled = false;
  }
});

function showResult(key, score, all) {
  setStatus('');
  const found = CLASSES[key] || CLASSES.other;
  document.getElementById('result').classList.add('show');
  document.getElementById('resultEmoji').textContent = found.emoji;
  document.getElementById('resultTitle').textContent = found.title;
  document.getElementById('resultSub').textContent = found.sub;
  document.getElementById('resultEn').textContent = found.en || '';
  document.getElementById('meterFill').style.width = Math.round(score * 100) + '%';
  document.getElementById('scoreLabel').textContent = '確信度（この見立ての自信）';
  document.getElementById('scoreValue').textContent = Math.round(score * 100) + '%';
  // NOTE: advice strings are static constants from CLASSES; no untrusted input.
  document.getElementById('advice').innerHTML = '<h3>🍽 ばなな先生のアドバイス</h3>' + found.advice;
}
</script>
</body>
</html>
